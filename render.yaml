# Render Blueprint for a FREE test deployment. Free = testing only:
# the web service sleeps after 15 min idle, local files are lost on restart,
# and the free Postgres expires 30 days after creation. No real lab data.
databases:
  - name: geo-unknown-db
    plan: free
services:
  - type: web
    name: geo-unknown-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: geo-unknown-db, property: connectionString}
      - key: GEO_JWT_SECRET
        generateValue: true
      - key: GEO_STORAGE
        value: /tmp/storage
      - key: GEO_CORS
        value: "null"
      - key: GEO_SETUP_TOKEN
        sync: false
